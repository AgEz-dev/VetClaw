services:
  vetclaw:
    build: .
    container_name: vetclaw
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - VETCLAW_MODEL=${VETCLAW_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VETCLAW_TIMEOUT=${VETCLAW_TIMEOUT:-15}
      - VETCLAW_TOTAL_TIMEOUT=${VETCLAW_TOTAL_TIMEOUT:-30}
      - VETCLAW_MAX_STEPS=${VETCLAW_MAX_STEPS:-5}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    env_file:
      - .env
    restart: unless-stopped
