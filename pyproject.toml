[project]
name = "vetclaw"
version = "2.0.0"
description = "宠物健康分诊 Agent：Fast-Path 规则守卫 + RAG 混合检索 + 原生 ReAct 调度"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "chromadb>=0.4.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "sentence-transformers>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "schemas*"]

[tool.ruff]
line-length = 100
target-version = "py311"
