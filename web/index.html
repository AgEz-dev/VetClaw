<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VetClaw · 宠物健康分诊助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #24292f; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #fff; padding: 12px 20px; border-bottom: 1px solid #e5e7eb;
  }
  .header-row {
    max-width: 860px; margin: 0 auto; display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  .header-title h1 { font-size: 16px; font-weight: 600; }
  .header-title .sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .url-box { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b7280; }
  .url-box input {
    padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 12px; width: 220px; font-family: monospace;
  }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .status-line {
    font-size: 12px; color: #6b7280; padding: 4px 0; display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: pulse 1.2s infinite; }
  .dot.done { background: #10b981; animation: none; }
  .dot.error { background: #ef4444; animation: none; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .card {
    margin: 6px 0; padding: 8px 12px; background: #f9fafb; border: 1px solid #e5e7eb;
    border-radius: 8px; font-size: 12px; color: #4b5563;
  }
  .card summary { cursor: pointer; font-weight: 500; outline: none; list-style: none; }
  .card summary::before { content: "▸ "; }
  .card[open] summary::before { content: "▾ "; }
  .card .body {
    margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e5e7eb;
    white-space: pre-wrap; font-family: monospace; font-size: 12px;
    max-height: 240px; overflow-y: auto;
  }
  .card.tool_call { border-left: 3px solid #8b5cf6; }
  .card.tool_result { border-left: 3px solid #10b981; }
  .card.error { border-left: 3px solid #ef4444; background: #fef2f2; color: #b91c1c; }
  .cite-badge {
    display: inline-block; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
    border-radius: 4px; padding: 0 5px; font-size: 11px; margin: 0 2px; font-family: monospace;
  }
  footer {
    border-top: 1px solid #e5e7eb; background: #fff; padding: 12px 20px;
  }
  .input-row { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; padding: 10px 12px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
  }
  textarea:focus { border-color: #2563eb; }
  button {
    padding: 10px 20px; background: #2563eb; color: #fff; border: none;
    border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .disclaimer {
    max-width: 860px; margin: 8px auto 0; text-align: center;
    font-size: 11px; color: #9ca3af;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="header-title">
      <h1>VetClaw · 宠物健康分诊助手</h1>
      <div class="sub">本地 RAG · SSE 流式输出</div>
    </div>
    <div class="url-box">
      <span>后端</span>
      <input id="baseUrl" value="http://127.0.0.1:8000" />
    </div>
  </div>
</header>

<div id="chat"></div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="2" placeholder="描述宠物症状，例如：我家猫呕吐两次，精神不振…"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="disclaimer">本回答仅供参考，不能替代执业兽医诊断。宠物出现紧急症状请立即就医。</div>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const baseUrlInput = document.getElementById("baseUrl");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function addMsg(role, html) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (html) bubble.innerHTML = html;
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addStatus(text, kind) {
  const div = document.createElement("div");
  div.className = "status-line";
  div.innerHTML = '<span class="dot ' + (kind || "") + '"></span><span class="txt">' + text + '</span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function updateStatus(el, text, kind) {
  if (!el) return;
  el.querySelector(".txt").textContent = text;
  const dot = el.querySelector(".dot");
  dot.className = "dot " + (kind || "");
}

function addCard(kind, title, bodyText) {
  const div = document.createElement("details");
  div.className = "card " + kind;
  if (kind === "error") div.open = true;
  const sum = document.createElement("summary");
  sum.textContent = title;
  div.appendChild(sum);
  if (bodyText) {
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = bodyText;
    div.appendChild(body);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderCitations(answer, citations) {
  let html = escapeHtml(answer);
  if (citations && citations.length) {
    for (const c of citations) {
      const safe = c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      html = html.replace(new RegExp(safe, "g"),
        '<span class="cite-badge">' + escapeHtml(c) + "</span>");
    }
  }
  return html;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  const base = baseUrlInput.value.replace(/\/+$/, "");
  input.value = "";
  sendBtn.disabled = true;
  addMsg("user", escapeHtml(text));

  const aiBubble = addMsg("ai", "");
  const statusEl = addStatus("思考中…");

  try {
    const resp = await fetch(base + "/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: text, history: [] })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        handleFrame(frame, aiBubble, statusEl);
      }
    }
    updateStatus(statusEl, "完成", "done");
  } catch (e) {
    updateStatus(statusEl, "连接失败", "error");
    addCard("error", "连接失败", e.message + "\n请确认后端已启动，且顶部 Base URL 正确。");
  } finally {
    sendBtn.disabled = false;
  }
}

function handleFrame(frame, aiBubble, statusEl) {
  let event = "message";
  const dataLines = [];
  for (const line of frame.split("\n")) {
    if (line.startsWith("event: ")) event = line.slice(7);
    else if (line.startsWith("data:")) dataLines.push(line.slice(5).replace(/^ /, ""));
  }
  if (!dataLines.length) return;

  let data;
  try { data = JSON.parse(dataLines.join("\n")); } catch { return; }

  switch (event) {
    case "thought":
      updateStatus(statusEl,
        data.stage === "executing_tool" ? "执行工具中…" : "思考中…");
      break;
    case "tool_call":
      addCard("tool_call", "调用工具：" + data.name,
        "参数：" + JSON.stringify(data.arguments, null, 2));
      break;
    case "tool_result":
      addCard("tool_result", "工具返回", String(data.content));
      break;
    case "token":
      aiBubble.textContent += data.text;
      chat.scrollTop = chat.scrollHeight;
      break;
    case "done":
      aiBubble.innerHTML = renderCitations(data.answer, data.citations);
      break;
    case "error":
      updateStatus(statusEl, "出错了", "error");
      addCard("error", (data.code || "ERROR") + "：" + (data.message || "未知错误"), "");
      break;
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
